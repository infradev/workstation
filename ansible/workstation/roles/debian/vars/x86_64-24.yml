repositories:
  - name: k8s
    uris: "https://pkgs.k8s.io/core:/stable:/v1.35/deb/"
    suites: "/"
    signed_by: "https://pkgs.k8s.io/core:/stable:/v1.35/deb/Release.key"
  - name: helm
    uris: "https://packages.buildkite.com/helm-linux/helm-debian/any/"
    suites: any
    components: main
    signed_by: "https://packages.buildkite.com/helm-linux/helm-debian/gpgkey"
  - name: gcloud
    uris: "https://packages.cloud.google.com/apt"
    suites: cloud-sdk
    components: main
    signed_by: "https://packages.cloud.google.com/apt/doc/apt-key.gpg"
  - name: docker
    uris: "https://download.docker.com/linux/ubuntu"
    suites: noble
    components: stable
    architectures: amd64
    signed_by: "https://download.docker.com/linux/ubuntu/gpg"
  - name: claude-code
    uris: "https://downloads.claude.ai/claude-code/apt/stable"
    suites: stable
    components: main
    signed_by: "https://downloads.claude.ai/keys/claude-code.asc"

ppas: []

remote_executables:
  - name: aws-iam-authenticator
    url: "https://github.com/kubernetes-sigs/aws-iam-authenticator/releases/download/v0.7.20/aws-iam-authenticator_0.7.20_linux_amd64"

shell:
  - curl -s https://raw.githubusercontent.com/terraform-linters/tflint/master/install_linux.sh | bash
  - curl -LsSf https://astral.sh/uv/install.sh | sh
  - cd "$(mktemp -d)" && LATEST_VERSION=$(curl --silent https://api.github.com/repos/tofuutils/tenv/releases/latest | jq -r .tag_name) && curl -O -L "https://github.com/tofuutils/tenv/releases/latest/download/tenv_${LATEST_VERSION}_amd64.deb" && sudo dpkg -i "tenv_${LATEST_VERSION}_amd64.deb"
  - cd "$(mktemp -d)" && LATEST_VERSION=$(curl --silent https://api.github.com/repos/kubernetes-sigs/krew/releases/latest | jq -r .tag_name) && KREW="krew-linux_amd64" && curl -fsSLO "https://github.com/kubernetes-sigs/krew/releases/download/${LATEST_VERSION}/${KREW}.tar.gz" && tar zxvf "${KREW}.tar.gz" && ./${KREW} install krew
  - cd "$(mktemp -d)" && curl "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip" -o "awscliv2.zip" && unzip -u awscliv2.zip && sudo ./aws/install --update
