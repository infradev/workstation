---

- name: Include vars
  include_vars:
    file: "{{ architecture }}-{{ distribution_major_version }}.yml"

- name: Update all packages to the latest version
  apt:
    update_cache: yes
    upgrade: yes
  become: true

- name: Inserting itens in .bashrc
  lineinfile:
    path: "{{ local_home }}/.bashrc"
    line: "{{ item }}"
  with_items: "{{ bashrc_includes }}"

- name: Ensure groups exist
  group:
    name: "{{ item }}"
    state: present
  with_items: "{{ user_groups }}"
  become: true

- name: adding existing user '{{ user_name }}' to groups
  user:
    name: "{{ user_name }}"
    groups: "{{ item }}"
    append: yes
  with_items: "{{ user_groups }}"
  become: true

- name: Add apt repositories
  ansible.builtin.deb822_repository:
    name: "{{ item.name }}"
    types: deb
    uris: "{{ item.uris }}"
    suites: "{{ item.suites }}"
    components: "{{ item.components | default(omit) }}"
    architectures: "{{ item.architectures | default(omit) }}"
    # Fetches the key (URL) and dearmors it into /etc/apt/keyrings/<name>.gpg
    # itself - no separate get_url + gpg --dearmor dance needed.
    signed_by: "{{ item.signed_by }}"
    install_python_debian: true
  with_items: "{{ repositories }}"
  become: true

- name: Add PPAs
  apt_repository:
    repo: "{{ item }}"
    state: present
  with_items: "{{ ppas }}"
  become: true

# deb822_repository does not refresh the apt cache itself (see module docs),
# so the newly added repos' packages (docker-ce, kubectl, claude-code, ...)
# wouldn't be visible to the "Install packages" task below without this.
- name: Update apt cache after adding repositories
  apt:
    update_cache: yes
  become: true

- name: Install packages
  apt:
    name: "{{ packages }}"
    state: present
  become: true

- name: Install remote packages
  apt:
    deb: "{{ item }}"
  with_items: "{{ remote_packages }}"
  become: true

- include_tasks: tarexe.yml
  with_items: "{{ remote_executables }}"
  when: item.url.endswith("tar.gz") or item.url.endswith("tgz")

- name: Install remote zip executable
  unarchive:
    src: "{{ item.url }}"
    dest: "{{ bin_path }}"
    remote_src: yes
  with_items: "{{ remote_executables }}"
  when: item.url.endswith("zip")

- name: Install remote executable
  get_url:
    url: "{{ item.url }}"
    dest: "{{ local_home }}/.local/bin/{{ item.name }}"
    owner: "{{ user_name }}"
    mode: 0755
  with_items: "{{ remote_executables }}"
  when: not item.url.endswith("tar.gz") and not item.url.endswith("tgz") and not item.url.endswith("zip")

- name: Run a command
  shell: "{{ item }}"
  with_items: "{{ shell }}"

- name: Install pip python package
  pip:
    name: "{{ item }}"
  with_items: "{{ pip }}"

- name: Checkout git repos
  git:
    repo: "{{ item.repo }}"
    dest: "{{ local_home }}/{{ item.name }}"
    update: no
  with_items: "{{ git_repos }}"
  ignore_errors: yes

- name: update Krew plugin list
  shell: "kubectl krew update"

- name: Install Krew plugins
  shell: "kubectl krew install {{ item }}"
  with_items: "{{ krew_plugins }}"
  when: krew_plugins is defined

# No automated VSCode/Cursor extension install here: this host is a headless
# SSH remote target. Cursor's remote-server extension host is installed by the
# client on first connect, not present ahead of time, so there's no reliable
# binary/path to drive from ansible. Recommended extensions are instead listed
# in the home.code-workspace file (see base role) so Cursor Remote-SSH offers
# them on open.

- name: Remove useless packages from the cache
  apt:
    autoclean: true
  become: true

- name: Remove dependencies that are no longer required
  apt:
    autoremove: true
  become: true
