directories:
  - .aws
  - .claude
  - .claude/skills
  - .config/direnv
  # Cursor user rules apply on the Mac client only.
  - path: .cursor/rules
    os_family: Darwin
  - .cursor/skills
  - .krew
  - .kube
  - .local/bin
  - path: .local/krew-install
    os_family: Debian
  - .local/share/tenv
  - .nvm
  - .ssh
  - .terraform.d/plugin-cache
  - path: .tflint.d/plugins
    os_family: Debian
  - .vscode
  - projects

krew_plugins:
  - ctx
  - get-all
  - ns
  - resource-capacity

files:
  - path: .bash_aliases
    template: bash_aliases.j2
  - path: .bash_profile
    template: bash_profile.j2
  - path: .bashrc
  - path: .claude/CLAUDE.md
    template: CLAUDE.md.j2
    mode: "0644"
  - path: .config/direnv/direnvrc
    template: direnvrc.j2
    mode: "0644"
  # Same instructions as CLAUDE.md, in the file Cursor actually loads.
  # alwaysApply is set in cursor-rule.mdc.j2.
  - path: .cursor/rules/workstation.mdc
    template: cursor-rule.mdc.j2
    mode: "0644"
    os_family: Darwin
  - path: .vimrc
  - path: home.code-workspace
    template: home.code-workspace.j2
    mode: "0644"
  - path: projects/.envrc.example
    template: .envrc.j2
    mode: "0644"

bashrc_includes:
  - "[ -f ~/.bash_aliases ] && . ~/.bash_aliases"
  - "[ -f ~/.bash_profile ] && . ~/.bash_profile"

git_repos:
  - name: projects/infradev/workstation
    repo: https://github.com/infradev/workstation.git

repos: []

vscode:
  extensions:
    common: "{{ lookup('file', playbook_dir ~ '/roles/base/files/vscode/extensions.json') | from_json }}"
  settings: "{{ lookup('file', playbook_dir ~ '/roles/base/files/vscode/settings.jsonc') }}"

ai:
  marketplaces:
    - affaan-m/ECC
    - akin-ozer/cc-devops-skills
    # Tier 3 (personal/style). Marketplace key unconfirmed; best-guess install.
    - ayghri/i-have-adhd
    # Already in active use. Required by ~/.claude/CLAUDE.md for Slack messages.
    - blader/humanizer
    # Composio plugin (composio). Authenticates with OAuth on first use, no API key.
    - ComposioHQ/composio-plugin-cc
    # Tier 3 (personal/style). Marketplace key unconfirmed; best-guess install.
    - dietrichgebert/ponytail
    # Off-target for this role (ML-training), requested anyway.
    - forrestchang/andrej-karpathy-skills
    - jfr992/terragrunt-skill
    # Already in active use (caveman mode).
    - JuliusBrussee/caveman
    - LukasNiessen/kubernetes-skill
    # Monorepo of skills, not single-skill-per-repo. Marketplace key unconfirmed (see README).
    - mattpocock/skills
  plugins:
    - andrej-karpathy-skills@karpathy-skills
    - atlassian@claude-plugins-official
    - aws-agents-for-devsecops@claude-plugins-official
    - aws-core@claude-plugins-official
    - caveman@caveman
    - claude-security@claude-plugins-official
    - cloudflare@claude-plugins-official
    - code-review@claude-plugins-official
    - code-simplifier@claude-plugins-official
    - commit-commands@claude-plugins-official
    - composio@composio
    - context7@claude-plugins-official
    - databases-on-aws@claude-plugins-official
    - devops-skills@akin-ozer
    - ecc@ecc
    - github@claude-plugins-official
    - humanizer@humanizer
    - i-have-adhd@i-have-adhd
    - kubernetes-skill@kubernetes-skill
    - mattpocock-skills@mattpocock
    - pagerduty@claude-plugins-official
    - ponytail@ponytail
    - pr-review-toolkit@claude-plugins-official
    - remember@claude-plugins-official
    - security-guidance@claude-plugins-official
    - slack@claude-plugins-official
    - superpowers@claude-plugins-official
    - supabase@claude-plugins-official
    - terraform@claude-plugins-official
    - terragrunt-skill@jfr992
    - vanta@claude-plugins-official

  # Remote MCP servers written to ~/.cursor/mcp.json. Cursor starts the OAuth flow on first use.
  cursor_mcp_servers:
    composio:
      url: https://connect.composio.dev/mcp

