user_groups:
  - docker
  - sudo

directories:
  - ~/.aws
  - ~/.ssh
  - ~/.local/bin
  - ~/.kube
  - ~/.vscode
  - ~/projects

files:
  - ~/.bashrc
  - ~/.bash_profile
  - ~/.vimrc

scripts:
  root:
    - bash_profile
    - bash_aliases
  specific: []
    # - dir: .vscode
    #   file: settings.json

bashrc_includes:
  - "[ -f ~/.bash_aliases ] && . ~/.bash_aliases"
  - "[ -f ~/.bash_profile ] && . ~/.bash_profile"

git_repos:
  - name: projects/infradev/workstation
    repo: git@github.com:infradev/workstation.git
  - name: projects/awslabs/aws-terraform-dev-container
    repo: git@github.com:awslabs/aws-terraform-dev-container.git

repos: []
