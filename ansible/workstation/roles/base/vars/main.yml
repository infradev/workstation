directories:
  - .aws
  - .claude
  - .claude/skills
  - .config/direnv
  # Cursor user rules apply on the Mac client only.
  - path: .cursor/rules
    os_family: Darwin
  - .cursor/skills
  - .krew
  - .kube
  - .local/bin
  - path: .local/krew-install
    os_family: Debian
  - .local/share/tenv
  - .nvm
  - .ssh
  - .terraform.d/plugin-cache
  - path: .tflint.d/plugins
    os_family: Debian
  - .vscode
  - projects

krew_plugins:
  - ctx
  - get-all
  - ns
  - resource-capacity

files:
  - path: .bash_aliases
    template: bash_aliases.j2
  - path: .bash_profile
    template: bash_profile.j2
  - path: .bashrc
  - path: .claude/CLAUDE.md
    template: CLAUDE.md.j2
    mode: "0644"
  - path: .config/direnv/direnvrc
    template: direnvrc.j2
    mode: "0644"
  # Same instructions as CLAUDE.md, in the file Cursor actually loads.
  # alwaysApply is set in cursor-rule.mdc.j2.
  - path: .cursor/rules/workstation.mdc
    template: cursor-rule.mdc.j2
    mode: "0644"
    os_family: Darwin
  - path: .vimrc
  - path: home.code-workspace
    template: home.code-workspace.j2
    mode: "0644"
  - path: projects/.envrc.example
    template: .envrc.j2
    mode: "0644"

bashrc_includes:
  - "[ -f ~/.bash_aliases ] && . ~/.bash_aliases"
  - "[ -f ~/.bash_profile ] && . ~/.bash_profile"

git_repos:
  - name: projects/infradev/workstation
    repo: https://github.com/infradev/workstation.git

repos: []

vscode:
  extensions:
    common:
      - amazonwebservices.aws-toolkit-vscode
      - anthropic.claude-code
      - davidanson.vscode-markdownlint
      - dbcode.dbcode
      - donjayamanne.githistory
      - eamodio.gitlens
      - editorconfig.editorconfig
      - esbenp.prettier-vscode
      - googlecloudtools.cloudcode
      - hashicorp.hcl
      - hashicorp.terraform
      - hverlin.mise-vscode
      - mhutchie.git-graph
      - mineiros.terramate
      - moshfeu.compare-folders
      - ms-azuretools.vscode-containers
      - ms-azuretools.vscode-docker
      - ms-kubernetes-tools.vscode-kubernetes-tools
      - ms-python.debugpy
      - ms-python.python
      - ms-python.vscode-pylance
      - ms-python.vscode-python-envs
      - opentofu.vscode-opentofu
      - pkief.material-icon-theme
      - qcz.text-power-tools
      - redhat.vscode-yaml
      - streetsidesoftware.code-spell-checker
      - timonwong.shellcheck
      - yzhang.markdown-all-in-one
  settings: |
    {
      // Editor settings
      "editor.formatOnSave": true,
      "editor.formatOnPaste": false,
      "editor.formatOnType": false,
      "editor.tabSize": 2,
      "editor.insertSpaces": true,
      "editor.renderWhitespace": "all",
      "editor.rulers": [
        80,
        100,
        120
      ],
      "editor.codeActionsOnSave": {
        "source.fixAll": "explicit"
      },

      // Files settings
      "files.autoSave": "afterDelay",
      "files.eol": "\n",
      "files.trimTrailingWhitespace": true,
      "files.insertFinalNewline": true,
      "files.trimFinalNewlines": true,
      "files.exclude": {
        "**/.git": true,
        "**/.DS_Store": true,
        "**/*.tfstate": true,
        "**/*.tfstate.*": true,
        "**/.terraform": true,
        ".terraform.lock.hcl": true
      },

      // Git workflow
      "git.autofetch": "all",
      "git.enableSmartCommit": true,
      "git.confirmSync": false,

      // Git repository detection
      // Scan every workspace folder and all folders nested in it (in the Dev
      // Container that is /workspaces/project). Never open parent repositories.
      // Skip folders that hold dependencies, caches, credentials, or tool clones.
      "git.autoRepositoryDetection": true,
      "git.openRepositoryInParentFolders": "never",
      "git.repositoryScanMaxDepth": -1,
      "git.repositoryScanIgnoredFolders": [
        "node_modules",
        ".creds",
        ".devcontainer",
        ".terraform"
      ],
      // Also scan each workspace folder itself.
      "git.scanRepositories": ["."],

      // Detection modes (uncomment one; true is active above)
      // true: workspace folders, nested folders, and parents of open files
      // "subFolders": nested folders of workspace folders
      // "openEditors": parent folders of open files
      // "git.autoRepositoryDetection": true,
      // "git.autoRepositoryDetection": "subFolders",
      // "git.autoRepositoryDetection": "openEditors",

      // Parent folder repositories (never is active above)
      // "always": open git roots above the workspace
      // "prompt": ask first
      // "git.openRepositoryInParentFolders": "always",
      // "git.openRepositoryInParentFolders": "prompt",

      // Nested scan depth (-1 is active above)
      // 1: one level of child folders
      // -1: unlimited depth
      // "git.repositoryScanMaxDepth": 1,
      // "git.repositoryScanMaxDepth": -1,

      // Scan paths (["."] is active above). Relative to a workspace folder.
      // Used only when autoRepositoryDetection is true or "subFolders".
      // "git.scanRepositories": [".", "projects/example"],

      // Repositories to ignore (relative or absolute paths)
      // "git.ignoredRepositories": [],

      // Extra folder names to skip during nested scan
      // "git.repositoryScanIgnoredFolders": ["node_modules", ".devcontainer", ".creds"],

      // Submodules and worktrees
      // "git.detectSubmodules": true,
      // "git.detectSubmodulesLimit": 10,
      // "git.ignoreSubmodules": false,
      // "git.detectWorktrees": true,
      // "git.detectWorktreesLimit": 10,

      // Source Control view
      // Tree is folders for files inside a repo. Path sorts those files and the repo list.
      "scm.defaultViewMode": "tree",
      "scm.defaultViewSortKey": "path",
      "scm.repositories.sortOrder": "path",

      // Source Control repository list
      // "scm.alwaysShowRepositories": true,
      // "scm.repositories.visible": 0,
      // "scm.repositories.sortOrder": "discovery time",
      // "scm.repositories.sortOrder": "name",
      // "scm.repositories.selectionMode": "multiple",
      // "scm.providerCountBadge": "hidden",
      // "scm.alwaysShowActions": false,
      // "scm.countBadge": "all",
      // "scm.autoReveal": true,
      // "scm.defaultViewMode": "list",
      // "scm.defaultViewSortKey": "name",
      // "scm.defaultViewSortKey": "status",

      // Terminal settings
      "terminal.integrated.scrollback": 100000,
      "terminal.integrated.defaultProfile.linux": "bash"{% if ansible_facts['os_family'] == 'Darwin' %},
      "terminal.integrated.profiles.linux": {
        "bash": {
          "path": "{{ '/opt/homebrew' if ansible_facts['architecture'] == 'arm64' else '/usr/local' }}/bin/bash"
        }
      }
      {%- endif %},

      // UI settings
      "workbench.iconTheme": "material-icon-theme",
      "workbench.tree.indent": 15,
      "workbench.tree.renderIndentGuides": "always",
      "workbench.colorCustomizations": {
        "tree.indentGuidesStroke": "#05ef3c"
      },
      "window.autoDetectColorScheme": false,

      // Spell checker settings
      "cSpell.enabled": true,
      "cSpell.words": [
        "aquasecurity",
        "azurerm",
        "checkov",
        "devcontainer",
        "gcloud",
        "hadolint",
        "helmfile",
        "infracost",
        "k9s",
        "krew",
        "kubeconfig",
        "kubectx",
        "kubens",
        "nvm",
        "pipx",
        "postgresql",
        "sops",
        "tenv",
        "terragrunt",
        "terramate",
        "terrascan",
        "tflint",
        "tfsec",
        "tofu",
        "trivy"
      ],

      // mise extension (hverlin.mise-vscode)
      // Use mise from PATH. Do not rewrite mise.binPath on startup.
      "mise.autoDetectMiseBinPath": false,

      // Terraform settings
      "[terraform]": {
        "editor.defaultFormatter": "hashicorp.terraform",
        "editor.formatOnSave": true,
        "editor.tabSize": 2
      },
      "[terraform-vars]": {
        "editor.defaultFormatter": "hashicorp.terraform",
        "editor.formatOnSave": true,
        "editor.tabSize": 2
      },
      "terraform.languageServer": {
        "enabled": true,
        "args": ["serve"]
      },
      "terraform.experimentalFeatures.validateOnSave": true,

      // YAML settings
      "[yaml]": {
        "editor.defaultFormatter": "redhat.vscode-yaml",
        "editor.formatOnSave": true,
        "editor.tabSize": 2
      },

      // Markdown settings
      "[markdown]": {
        "editor.defaultFormatter": "yzhang.markdown-all-in-one",
        "editor.formatOnSave": true
      }
    }

