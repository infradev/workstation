directories:
  - .aws
  - .claude
  - .claude/skills
  - .config/direnv
  # Cursor user rules apply on the Mac client only.
  - path: .cursor/rules
    os_family: Darwin
  - .cursor/skills
  - .krew
  - .kube
  - .local/bin
  - path: .local/krew-install
    os_family: Debian
  - .local/share/tenv
  - .nvm
  - .ssh
  - .terraform.d/plugin-cache
  - path: .tflint.d/plugins
    os_family: Debian
  - .vscode
  - projects

krew_plugins:
  - ctx
  - get-all
  - ns
  - resource-capacity

files:
  - path: .bash_aliases
    template: bash_aliases.j2
  - path: .bash_profile
    template: bash_profile.j2
  - path: .bashrc
  - path: .claude/CLAUDE.md
    template: CLAUDE.md.j2
    mode: "0644"
    # Deliberately force:false. A tool like plat-context:setup appends a
    # managed block to this file after bootstrap; re-running this role must
    # never clobber that live, engine-owned content.
    force: false
  - path: .config/direnv/direnvrc
    template: direnvrc.j2
    mode: "0644"
  # Same instructions as CLAUDE.md, in the file Cursor actually loads.
  # alwaysApply is set in cursor-rule.mdc.j2.
  - path: .cursor/rules/workstation.mdc
    template: cursor-rule.mdc.j2
    mode: "0644"
    os_family: Darwin
  - path: .vimrc
  - path: home.code-workspace
    template: home.code-workspace.j2
    mode: "0644"
  - path: projects/.envrc.example
    template: .envrc.j2
    mode: "0644"

bashrc_includes:
  - "[ -f ~/.bash_aliases ] && . ~/.bash_aliases"
  - "[ -f ~/.bash_profile ] && . ~/.bash_profile"

git_repos:
  - name: projects/infradev/workstation
    repo: https://github.com/infradev/workstation.git

repos: []

vscode:
  extensions:
    common:
      - amazonwebservices.aws-toolkit-vscode
      - anthropic.claude-code
      - davidanson.vscode-markdownlint
      - dbcode.dbcode
      - donjayamanne.githistory
      - eamodio.gitlens
      - editorconfig.editorconfig
      - esbenp.prettier-vscode
      - googlecloudtools.cloudcode
      - hashicorp.hcl
      - hashicorp.terraform
      - mhutchie.git-graph
      - mineiros.terramate
      - moshfeu.compare-folders
      - ms-azuretools.vscode-containers
      - ms-azuretools.vscode-docker
      - ms-kubernetes-tools.vscode-kubernetes-tools
      - ms-python.debugpy
      - ms-python.python
      - ms-python.vscode-pylance
      - ms-python.vscode-python-envs
      - opentofu.vscode-opentofu
      - pkief.material-icon-theme
      - qcz.text-power-tools
      - redhat.vscode-yaml
      - streetsidesoftware.code-spell-checker
      - timonwong.shellcheck
      - yzhang.markdown-all-in-one
  settings: |
    {
      // Editor settings
      "editor.formatOnSave": true,
      "editor.formatOnPaste": false,
      "editor.formatOnType": false,
      "editor.tabSize": 2,
      "editor.insertSpaces": true,
      "editor.renderWhitespace": "all",
      "editor.rulers": [
        80,
        100,
        120
      ],
      "editor.codeActionsOnSave": {
        "source.fixAll": "explicit"
      },

      // Files settings
      "files.autoSave": "afterDelay",
      "files.eol": "\n",
      "files.trimTrailingWhitespace": true,
      "files.insertFinalNewline": true,
      "files.trimFinalNewlines": true,
      "files.exclude": {
        "**/.git": true,
        "**/.DS_Store": true,
        "**/*.tfstate": true,
        "**/*.tfstate.*": true,
        "**/.terraform": true,
        ".terraform.lock.hcl": true
      },

      // Git settings
      "git.autofetch": "all",
      "git.enableSmartCommit": true,
      "git.confirmSync": false,

      // Terminal settings
      "terminal.integrated.scrollback": 100000,
      "terminal.integrated.defaultProfile.linux": "bash"{% if ansible_facts['os_family'] == 'Darwin' %},
      "terminal.integrated.profiles.linux": {
        "bash": {
          "path": "{{ '/opt/homebrew' if ansible_facts['architecture'] == 'arm64' else '/usr/local' }}/bin/bash"
        }
      }
      {%- endif %},

      // UI settings
      "workbench.iconTheme": "material-icon-theme",
      "workbench.tree.indent": 15,
      "workbench.tree.renderIndentGuides": "always",
      "workbench.colorCustomizations": {
        "tree.indentGuidesStroke": "#05ef3c"
      },
      "window.autoDetectColorScheme": false,

      // Spell checker settings
      "cSpell.enabled": true,
      "cSpell.words": [
        "azurerm",
        "checkov",
        "devcontainer",
        "gcloud",
        "infracost",
        "terragrunt",
        "terrascan",
        "tflint",
        "tfsec"
      ],

      // Terraform settings
      "[terraform]": {
        "editor.defaultFormatter": "hashicorp.terraform",
        "editor.formatOnSave": true,
        "editor.tabSize": 2
      },
      "[terraform-vars]": {
        "editor.defaultFormatter": "hashicorp.terraform",
        "editor.formatOnSave": true,
        "editor.tabSize": 2
      },
      "terraform.languageServer": {
        "enabled": true,
        "args": ["serve"]
      },
      "terraform.experimentalFeatures.validateOnSave": true,

      // YAML settings
      "[yaml]": {
        "editor.defaultFormatter": "redhat.vscode-yaml",
        "editor.formatOnSave": true,
        "editor.tabSize": 2
      },

      // Markdown settings
      "[markdown]": {
        "editor.defaultFormatter": "yzhang.markdown-all-in-one",
        "editor.formatOnSave": true
      }
    }

