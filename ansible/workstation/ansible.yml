---
- hosts: all
  # connection: local
  gather_facts: yes
  # become: yes
  become_method: sudo
  vars:
    user_name: "{{ lookup('env', 'USER') }}"
    group_name: "{{ lookup('env', 'USER') }}"
    local_home: "{{ ansible_facts['env']['HOME'] | default(lookup('env', 'HOME')) }}"
    bin_path: "{{ local_home }}/.local/bin"
    data_dir: "{{ local_home }}/.local/share"
    os_family: "{{ ansible_facts['os_family'] | lower }}"
    distribution_major_version: "{{ ansible_facts['distribution_major_version'] }}"
    architecture: "{{ ansible_facts['architecture'] }}"
  environment:
  roles:
    - role: base
    - role: debian
      when: ansible_facts['os_family'] == 'Debian'
    - role: macos
      when: ansible_facts['os_family'] == 'Darwin'
  # import_role runs after the OS roles. A second `role:` entry repeats main.yml.
  tasks:
    - name: Install AI plugins, gh act, and Krew plugins
      ansible.builtin.import_role:
        name: base
        tasks_from: finalize
